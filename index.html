<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Библиотека знаний</title>
  <meta name="description" content="Личная библиотека уроков">
  <meta name="theme-color" content="#f3ead8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%239a5a2f'/><path d='M9 9h6a3 3 0 0 1 3 3v11a2 2 0 0 0-2-2H9zM23 9h-3a2 2 0 0 0-2 2' stroke='%23fbf6ec' stroke-width='2' fill='none' stroke-linejoin='round'/></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Уроки">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Manrope:wght@500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="./"><span class="brand-dot"></span>Библиотека</a>
      <button class="icon-btn" id="readerBtn" aria-label="Настройки чтения">Aa</button>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Мои уроки</h1>
      <p id="stats">Загружаю…</p>
      <input class="search" id="search" type="search" placeholder="Поиск по темам" autocomplete="off">
      <div class="chips" role="group" aria-label="Фильтр">
        <button class="chip" data-f="all" aria-pressed="true">Все</button>
        <button class="chip" data-f="progress" aria-pressed="false">В процессе</button>
        <button class="chip" data-f="done" aria-pressed="false">Пройдено</button>
        <button class="chip" data-f="new" aria-pressed="false">Новые</button>
      </div>
    </section>

    <div id="due"></div>
    <div id="pinned"></div>
    <div id="all"></div>

    <section class="request" id="request">
      <h2>Хочу изучить…</h2>
      <p>Напиши тему. Откроется GitHub с готовой заявкой, останется нажать «Create». Урок появится здесь после ближайшего запуска по расписанию.</p>
      <textarea id="topic" placeholder="Например: как работает сложный процент"></textarea>
      <div class="chips" role="group" aria-label="Глубина" id="depth">
        <button class="chip" data-d="Просто узнать" aria-pressed="false">Просто узнать</button>
        <button class="chip" data-d="Запомнить надолго" aria-pressed="true">Запомнить надолго</button>
      </div>
      <div style="height:12px"></div>
      <button class="btn btn-primary btn-block" id="sendRequest">Отправить заявку</button>
    </section>
  </main>

  <footer class="footer wrap">Прогресс хранится только в этом браузере.</footer>

  <script src="assets/app.js"></script>
  <script src="assets/home.js"></script>
</body>
</html>
